name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # ubuntu-24.04 keeps the bash 5.2.21 oracle. ubuntu-latest is moving to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: test suites
        run: |
          python3 tests/guard_test.py
          python3 tests/install_test.py
          python3 tests/update_test.py
          python3 tests/context_attribution_test.py
          python3 tests/reset_test.py
          python3 tests/overlap_test.py
          python3 tests/overlap_eval_test.py
          python3 tests/ship_eval_test.py
          python3 tests/ship_cmd_test.py
          python3 tests/wait_test.py
          python3 tests/registry_test.py
          python3 tests/charter_test.py
          python3 tests/quiet_eval_test.py
          python3 tests/poteto_test.py
      - name: guard model
        run: python3 -B .claude/skills/verify-gantry-guard/check.py
